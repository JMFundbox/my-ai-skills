interface:
  display_name: "GitHub Flock Repo Manager"
  short_description: "Dispatch GitHub issues and epics to Flock-powered Herdr worktree managers, monitor their PRs, and consolidate merging"
  default_prompt: "Use /github-flock-repo-manager to run a repo-level manager for the Flock-coordinated managers. Wait for my request to dispatch open GitHub issues or epics; for each, create a Herdr worktree from the current or specified branch with an appropriate branch name, name the initial tab admin-<number> and the initial agent pane manager-<number>, start proclaude with advanced-adaai, and dispatch /goal using /github-flock-issue-pr-manager (issue) or /github-flock-epic-issue-manager (epic). Monitor the leads and PRs, treat an idle lead as finished only when its final report names the current PR head SHA, merge mergeable PRs one at a time using the repo's allowed or my chosen merge method, and notify leads whose PR target branch has diverged. Never implement, touch a dispatched flock, bypass branch protection, or answer an agent's permission prompts."

interface:
  display_name: "GitHub Epic Issue Manager"
  short_description: "Manage code-change sub-issues of a GitHub epic issue targeting an epic branch through Herdr worktrees and /github-issue-pr-manager"
  default_prompt: "Use /github-epic-issue-manager to manage the epic issue. Ensures a clean worktree, renames the epic branch appropriately before tracking origin, drafts a parent Epic PR targeting main, dispatches code-change sub-issues to Herdr worktrees targeting the epic branch with Advanced AdaAI without implementing sub-issues manually, leaves sub-issue CI/wpci monitoring entirely to child agents, merges sub-issue PRs into the epic branch once marked ready, syncs only the epic issue's worktree (keeping main strictly unaltered), closes finished sub-issue worktrees upon PR merge, and only after the code-change stop condition is met, executes the PR stage by spawning pr-reviewer (Advanced AdaAI) and e2e-tester (Lite AdaAI) to validate and open the Epic PR for review."
